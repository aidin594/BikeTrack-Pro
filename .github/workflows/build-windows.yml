name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify Python syntax
        run: python -m py_compile BikeTrack_Pro.pyw

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name BikeTrack-Pro --hidden-import win32timezone BikeTrack_Pro.pyw

      - name: Upload Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: BikeTrack-Pro-Windows
          path: dist/BikeTrack-Pro.exe
          if-no-files-found: error
          retention-days: 30
