name: Publish first Windows release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-first-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Check Python syntax
        run: python -m py_compile BikeTrack_Pro.pyw
      - name: Create Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name BikeTrack-Pro --hidden-import win32timezone BikeTrack_Pro.pyw
      - name: Publish v1.0.0 only if not already released
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v1.0.0 already exists. Nothing to publish."
            exit 0
          }
          gh release create v1.0.0 dist/BikeTrack-Pro.exe --target "${{ github.sha }}" --title "BikeTrack Pro v1.0.0" --notes "First public GitHub release of BikeTrack Pro for Windows. Includes repair and customer tracking, visit history, receipt printing, internal shop notes, customer flags, bike statistics, and updated built-in About and Help screens. Download BikeTrack-Pro.exe below. Back up existing customer_bikes.db before upgrading. The EXE has been built on GitHub Actions and functionally tested only for basic launch and database save/reload; receipt printing still requires verification on each Windows setup."
